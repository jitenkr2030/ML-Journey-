<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReconcileAI — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #0c0c0c;
            --border: #181818;
            --border-hover: #282828;
            --accent: #00e88f;
            --accent-glow: rgba(0, 232, 143, 0.06);
            --text-primary: #eae6de;
            --text-muted: #5e5a54;
            --text-dim: #343230;
            --danger: #ff4d4d;
            --warning: #ffb84d;
            --mono: 'DM Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--sans);
            padding: 40px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-family: var(--mono);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .header h1 span { color: var(--accent); }

        .header .meta {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-box {
            padding: 16px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            flex: 1;
        }

        .stat-box .label {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stat-box .val {
            font-size: 28px;
            font-weight: 600;
            margin-top: 6px;
            letter-spacing: -1px;
        }

        .stat-box .val.accent { color: var(--accent); }
        .stat-box .val.warning { color: var(--warning); }
        .stat-box .val.danger { color: var(--danger); }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.01);
        }

        td {
            font-family: var(--mono);
            font-size: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        tr:last-child td { border-bottom: none; }

        tr:hover { background: rgba(255,255,255,0.015); }

        .badge {
            display: inline-block;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 100px;
        }

        .badge.pending {
            background: rgba(255, 184, 77, 0.1);
            color: var(--warning);
            border: 1px solid rgba(255, 184, 77, 0.2);
        }

        .badge.verified {
            background: rgba(0, 232, 143, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 232, 143, 0.2);
        }

        .badge.rejected {
            background: rgba(255, 77, 77, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .actions { display: flex; gap: 8px; }

        .btn-verify, .btn-reject {
            padding: 6px 16px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            background: transparent;
        }

        .btn-verify {
            color: var(--accent);
        }

        .btn-verify:hover {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .btn-reject {
            color: var(--danger);
        }

        .btn-reject:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .utr {
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .empty {
            text-align: center;
            padding: 60px;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-dim);
        }

        .auto-refresh {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div class="header">
        <h1>reconcile<span>ai</span> — admin</h1>
        <span class="auto-refresh" id="refresh-indicator">Auto-refresh: 10s</span>
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <table id="payments-table">
        <thead>
            <tr>
                <th>#</th>
                <th>UTR / Transaction ID</th>
                <th>Amount</th>
                <th>Entries</th>
                <th>Matched</th>
                <th>Match Rate</th>
                <th>Status</th>
                <th>Submitted</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="payments-body"></tbody>
    </table>

    <script>
        const API = '';
        const KEY = new URLSearchParams(window.location.search).get('key') || '';

        async function loadPayments() {
            try {
                const res = await fetch(`${API}/api/admin/payments?key=${KEY}`);
                if (!res.ok) {
                    document.getElementById('payments-body').innerHTML =
                        '<tr><td colspan="9" class="empty">Access denied. Add ?key=your_admin_key to URL</td></tr>';
                    return;
                }
                const data = await res.json();
                renderStats(data);
                renderTable(data);
            } catch (err) {
                document.getElementById('payments-body').innerHTML =
                    `<tr><td colspan="9" class="empty">Cannot reach backend: ${err.message}</td></tr>`;
            }
        }

        function renderStats(data) {
            const pending = data.filter(d => d.status === 'pending').length;
            const verified = data.filter(d => d.status === 'verified').length;
            const rejected = data.filter(d => d.status === 'rejected').length;
            const revenue = data.filter(d => d.status === 'verified')
                .reduce((sum, d) => sum + (d.amount || 0), 0);

            document.getElementById('stats-bar').innerHTML = `
                <div class="stat-box">
                    <div class="label">Total Submissions</div>
                    <div class="val">${data.length}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Pending</div>
                    <div class="val warning">${pending}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Verified</div>
                    <div class="val accent">${verified}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Revenue</div>
                    <div class="val accent">₹${revenue.toLocaleString()}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Rejected</div>
                    <div class="val danger">${rejected}</div>
                </div>
            `;
        }

        function renderTable(data) {
            if (!data.length) {
                document.getElementById('payments-body').innerHTML =
                    '<tr><td colspan="9" class="empty">No payments yet. Waiting for submissions...</td></tr>';
                return;
            }

            const tbody = document.getElementById('payments-body');
            tbody.innerHTML = data.map(row => {
                const date = new Date(row.created_at);
                const timeStr = date.toLocaleString('en-IN', {
                    day: '2-digit', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                const actions = row.status === 'pending' ? `
                    <div class="actions">
                        <button class="btn-verify" onclick="verify(${row.id})">Verify</button>
                        <button class="btn-reject" onclick="reject(${row.id})">Reject</button>
                    </div>
                ` : row.status === 'verified' ? `
                    <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim)">
                        ${row.verified_at ? new Date(row.verified_at).toLocaleString('en-IN', {hour:'2-digit',minute:'2-digit'}) : ''}
                    </span>
                ` : '';

                return `
                    <tr>
                        <td>${row.id}</td>
                        <td class="utr">${row.utr}</td>
                        <td>₹${row.amount}</td>
                        <td>${row.total_transactions || '—'}</td>
                        <td>${row.matched_count || '—'}</td>
                        <td>${row.match_rate ? row.match_rate + '%' : '—'}</td>
                        <td><span class="badge ${row.status}">${row.status}</span></td>
                        <td>${timeStr}</td>
                        <td>${actions}</td>
                    </tr>
                `;
            }).join('');
        }

        async function verify(id) {
            await fetch(`${API}/api/admin/verify/${id}?key=${KEY}`, { method: 'POST' });
            loadPayments();
        }

        async function reject(id) {
            if (!confirm('Reject this payment?')) return;
            await fetch(`${API}/api/admin/reject/${id}?key=${KEY}`, { method: 'POST' });
            loadPayments();
        }

        // Load immediately + refresh every 10s
        loadPayments();
        setInterval(loadPayments, 10000);
    </script>
</body>
</html>
