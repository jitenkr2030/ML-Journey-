<!DOCTYPE html><html><head><title>Dashboard - ReconcileAI</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:'Inter',sans-serif;background:#080810;color:#eeeef6;margin:0;padding:24px}
h1{font-size:28px;font-weight:800}
.card{background:#12122a;border:1px solid #2a2b4a;border-radius:16px;padding:24px;margin:16px 0}
.btn{padding:10px 20px;background:#7c6cf0;color:#fff;border:none;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
</style></head><body>
<h1>ReconcileAI Dashboard</h1>
<p style="color:#9898b0">Welcome back. Your reconciliation history and compliance status.</p>
<div class="card"><h3>Quick Actions</h3>
<a href="/" class="btn" style="margin-right:8px">New Reconciliation</a>
<a href="/admin.html" class="btn" style="background:#00d4aa;color:#000">Admin Panel</a>
</div>
<div class="card"><h3>History</h3><p style="color:#585870">Your reconciliation history will appear here after your first run.</p></div>
<script>
fetch('/api/auth/me').then(r=>r.json()).then(d=>{
if(!d.success){window.location.href='/'}
else{document.querySelector('p').textContent='Welcome back, '+d.user.name+'! Your reconciliation history and compliance status.'}
}).catch(()=>{window.location.href='/'});
</script>
</body></html>
